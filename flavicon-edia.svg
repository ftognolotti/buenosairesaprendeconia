<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fondo Azul Noche / Slate tech -->
  <rect width="64" height="64" rx="14" fill="#0A192F"/>
  
  <!-- "ED" (Educación Digital) -->
  <text x="32" y="27" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ED</text>
  
  <!-- Línea divisora con nodo de conexión red/IA -->
  <line x1="16" y1="33" x2="48" y2="33" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="32" cy="33" r="3" fill="#38BDF8"/>
  
  <!-- "IA" (Inteligencia Artificial) en cian brillante -->
  <text x="32" y="54" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" fill="#38BDF8" text-anchor="middle" letter-spacing="1">IA</text>
</svg>
